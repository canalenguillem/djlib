# Solo se publica en el host el puerto del frontend. El backend y MariaDB viven
# dentro de la red de compose; el navegador llega a la API a traves del proxy
# del dev server de Vite (/api -> backend:8000).
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    # Sin puertos publicados. Para conectar un cliente SQL externo puntualmente:
    #   docker compose run --rm --service-ports -p 3307:3306 db
    # o descomenta:
    # ports:
    #   - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Sin puertos publicados: solo accesible desde la red de compose y a traves
    # del proxy del frontend. Para atacar la API directa desde el host:
    #   docker compose exec backend curl -s localhost:8000/health

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      # URL relativa: el navegador pide /api al propio frontend y Vite lo
      # reenvia a backend:8000, asi que no hace falta CORS ni exponer el backend.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_BACKEND_ORIGIN: http://backend:8000
      # Nombres de host desde los que se accede al dev server (ademas de IPs y
      # localhost, que Vite permite siempre). Ver VITE_ALLOWED_HOSTS en .env
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_HOST_PORT:-5175}:5173"

volumes:
  mariadb_data:
  frontend_node_modules:
