# Imagen de produccion: sirve el build estatico y hace de proxy hacia el
# backend, igual que el dev server de Vite, para que solo haya un puerto
# publicado y no haga falta CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los fragmentos de audio del reconocimiento y las respuestas de la API
    # pueden pasar del limite por defecto de 1 MB.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No anunciar la version de nginx ni permitir que la app se embeba en
    # un iframe ajeno.
    server_tokens off;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Las descargas con yt-dlp tardan, pero la peticion responde al
        # instante; aun asi se da margen a las respuestas mas lentas.
        proxy_read_timeout 120s;
    }

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # nginx NO hereda los add_header del bloque padre en cuanto un location
        # define los suyos, asi que hay que repetirlos donde haga falta.
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # index.html nunca se cachea, o el navegador seguiria pidiendo el build viejo
    location = /index.html {
        add_header Cache-Control "no-cache";
        # nginx NO hereda los add_header del bloque padre en cuanto un location
        # define los suyos, asi que hay que repetirlos donde haga falta.
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SPA: cualquier ruta desconocida la resuelve React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
